name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Run server security smoke test
        run: npm run test:security
        working-directory: server
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Lint all client applications
        run: npm run lint --workspaces --if-present -- --max-warnings 0
        working-directory: client
      - name: Build all client applications
        run: npm run build
        working-directory: client
      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker.example config --quiet

  api-integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Start API dependencies and backend
        run: docker compose --env-file .env.docker.example up --build -d database redis migrations backend
      - name: Wait for backend health
        run: |
          for attempt in {1..30}; do
            if docker compose --env-file .env.docker.example exec -T backend node -e "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run API integration smoke test
        run: docker compose --env-file .env.docker.example exec -T backend node dist/scripts/apiIntegrationSmokeTest.js
      - name: Collect service logs on failure
        if: failure()
        run: docker compose --env-file .env.docker.example logs --no-color backend migrations database redis
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.docker.example down -v
