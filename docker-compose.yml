name: voro

# One Compose stack for local use and the production server. Locally, the
# values in .env.docker use http://*.localhost. On the server, replace those
# addresses with real hostnames and set NODE_ENV=production.
services:
  caddy:
    image: caddy:2.10-alpine
    command:
      - /bin/sh
      - -ec
      - "printf '%s\\n' \"$$CADDY_CONFIG\" | caddy run --config /dev/stdin --adapter caddyfile"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-local@localhost}
      CUSTOMER_ADDRESS: ${CUSTOMER_ADDRESS:-http://localhost}
      RESTAURANT_ADDRESS: ${RESTAURANT_ADDRESS:-http://restaurant.localhost}
      DRIVER_ADDRESS: ${DRIVER_ADDRESS:-http://driver.localhost}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-http://admin.localhost}
      API_ADDRESS: ${API_ADDRESS:-http://api.localhost}
      CADDY_CONFIG: |
        {
          email {$$CADDY_EMAIL}
        }

        {$$CUSTOMER_ADDRESS} {
          encode zstd gzip
          reverse_proxy customer-app:80
        }

        {$$RESTAURANT_ADDRESS} {
          encode zstd gzip
          reverse_proxy restaurant-app:80
        }

        {$$DRIVER_ADDRESS} {
          encode zstd gzip
          reverse_proxy driver-app:80
        }

        {$$ADMIN_ADDRESS} {
          encode zstd gzip
          reverse_proxy admin-app:80
        }

        {$$API_ADDRESS} {
          encode zstd gzip
          reverse_proxy backend:5000
        }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      customer-app:
        condition: service_started
      restaurant-app:
        condition: service_started
      driver-app:
        condition: service_started
      admin-app:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - voro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voro}
      POSTGRES_USER: ${POSTGRES_USER:-voro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    ports:
      - "${DATABASE_HOST_BIND:-127.0.0.1}:${DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - voro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  database-backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-voro}
      PGUSER: ${POSTGRES_USER:-voro}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /backups
        while true; do
          pg_dump --format=custom --file "/backups/voro-$$(date +%Y%m%dT%H%M%SZ).dump"
          find /backups -type f -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - ./backups:/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  migrations:
    build:
      context: ./server
    env_file: &server-env-file
      - path: ./server/.env
        required: false
    command: node dist/database/migrate.js
    environment: &server-environment
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      API_URL: ${API_URL:-http://api.localhost}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-voro}
      DB_USER: ${POSTGRES_USER:-voro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      PAYMENT_CARD_ENCRYPTION_KEY: ${PAYMENT_CARD_ENCRYPTION_KEY:?Set PAYMENT_CARD_ENCRYPTION_KEY in .env.docker}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost,http://restaurant.localhost,http://driver.localhost,http://admin.localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AUTH0_CALLBACK_URL: ${AUTH0_CALLBACK_URL:-}
      AUTH0_CLIENT_REDIRECT_URL: ${AUTH0_CLIENT_REDIRECT_URL:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./server
    env_file: *server-env-file
    environment: *server-environment
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-5000}:5000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  customer-app:
    build:
      context: ./client
      args:
        APP_NAME: customer-app
        VITE_API_URL: ${VITE_API_URL:-http://api.localhost}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        VITE_AUTH0_GOOGLE_ENABLED: ${VITE_AUTH0_GOOGLE_ENABLED:-true}
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    restart: unless-stopped

  restaurant-app:
    build:
      context: ./client
      args:
        APP_NAME: restaurant-app
        VITE_API_URL: ${VITE_API_URL:-http://api.localhost}
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    restart: unless-stopped

  driver-app:
    build:
      context: ./client
      args:
        APP_NAME: driver-app
        VITE_API_URL: ${VITE_API_URL:-http://api.localhost}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    restart: unless-stopped

  admin-app:
    build:
      context: ./client
      args:
        APP_NAME: admin-app
        VITE_API_URL: ${VITE_API_URL:-http://api.localhost}
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  voro-postgres-data:
  voro-redis-data:
