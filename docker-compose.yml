services:
  backend:
    build:
      context: ./server
    container_name: voro-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: voro
      DB_USER: admin
      DB_PASSWORD: admin
      JWT_SECRET: voro_secret_key
      PAYMENT_CARD_ENCRYPTION_KEY: ${PAYMENT_CARD_ENCRYPTION_KEY:-voro_secret_key}
      CLIENT_URLS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-your-email@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-your-app-password}
      SMTP_FROM: ${SMTP_FROM:-Voro <your-email@gmail.com>}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  customer-app:
    build:
      context: ./client
    container_name: voro-customer-app
    command: npm run dev --workspace=customer-app
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  restaurant-app:
    build:
      context: ./client
    container_name: voro-restaurant-app
    command: npm run dev --workspace=restaurant-app
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_started

  driver-app:
    build:
      context: ./client
    container_name: voro-driver-app
    command: npm run dev --workspace=driver-app
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5175:5175"
    depends_on:
      backend:
        condition: service_started
